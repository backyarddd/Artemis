[project]
name = "artemis"
version = "0.1.0"
description = "Host-agnostic always-on autonomous agent harness on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "claude-agent-sdk>=0.2.108",
    "discord-py>=2.3",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "python-telegram-bot>=21",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
artemis = "artemis.__main__:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]
